# Baut Viebrans und veröffentlicht es auf GitHub Pages,
# damit man es direkt am Handy im Browser öffnen kann.
name: Deploy Pages

# Läuft nur auf Zuruf und auf dem Hauptzweig, damit fehlgeschlagene Deploys
# nicht jeden Push auf einem Entwicklungszweig rot färben.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Läuft immer nur ein Deploy gleichzeitig.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Voraussetzung: GitHub Pages ist für das Repo eingeschaltet
      # (Settings -> Pages -> Source: GitHub Actions). Für private Repos
      # ist Pages kostenpflichtig — im kostenlosen Tarif muss das Repo
      # dafür öffentlich sein. Das Actions-Token kann Pages nicht selbst
      # anlegen, deshalb schlägt dieser Schritt sonst fehl.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
